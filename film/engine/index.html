<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Round the Lantern: engine</title>
<style>
  html, body { margin: 0; background: #14100d; color: #d8cdb8; font: 13px/1.4 sans-serif; }
  canvas { display: block; width: 100vw; max-width: 1920px; aspect-ratio: 16/9; height: auto; }
  #ui { padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
  #ui input[type=range] { flex: 1; }
  #err { color: #f88; white-space: pre-wrap; font-family: monospace; padding: 6px 10px; }
  body.render #ui { display: none; }
  body.render canvas { width: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui">
  <button id="play">play</button>
  <input id="scrub" type="range" min="0" max="20" step="0.0417" value="0">
  <span id="tc">0.00</span> <span id="info"></span>
</div>
<div id="err"></div>
<script>
// Load order: the engine (classic scripts), then kits (ES modules or classic scripts, loaded with import(); a missing
// kit file is skipped; a module that exports register(ENGINE) has it called), then the placeholder (which fills in
// only what the real kits haven't), then the shot list. Must be served over http: node render.mjs --serve
const CORE = ['core.js', 'print.js', 'type.js'], KITS = ['light.js', 'birds.js', 'chart.js'], AFTER = ['placeholder.js'], SHOTS = ['shots.js'];
function load(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = () => res(true); s.onerror = () => rej(new Error('failed to load ' + src));
    document.head.appendChild(s);
  });
}
const SKIP = new Set((new URLSearchParams(location.search).get('skip') || '').split(',').filter(Boolean).map(s => s.replace(/\.js$/, '') + '.js'));
async function loadKit(src) {
  if (SKIP.has(src)) return false;
  const r = await fetch(src, { method: 'HEAD', cache: 'no-store' });
  if (!r.ok) return false;
  const m = await import('./' + src);
  if (typeof m.register === 'function') await m.register(window.ENGINE);
  return true;
}
const params = new URLSearchParams(location.search);
window.ready = (async () => {
  for (const s of CORE) await load(s);
  for (const s of KITS) await loadKit(s);
  for (const s of AFTER) await load(s);
  for (const s of SHOTS) await loadKit(s);
  await ENGINE.init();
})();
window.ready.catch(e => { document.getElementById('err').textContent = e.stack || e; console.error(e.stack || e); });
if (params.has('render')) document.body.classList.add('render');
else window.ready.then(() => {
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), info = document.getElementById('info');
  scrub.max = params.get('shot') ? ENGINE.shots[params.get('shot')].dur : ENGINE.filmDuration();
  let playing = false, busy = false, t0 = 0, s0 = 0;
  const draw = async () => {
    if (busy) return; busy = true;
    const t = +scrub.value, a = performance.now(); const F = await renderFrame(t);
    tc.textContent = t.toFixed(2); info.textContent = `${F.shot.name} +${F.tl.toFixed(2)}  ${(performance.now() - a).toFixed(0)} ms`; busy = false;
  };
  scrub.oninput = draw;
  document.getElementById('play').onclick = () => { playing = !playing; t0 = performance.now(); s0 = +scrub.value; };
  const loop = async () => { if (playing) { scrub.value = s0 + (performance.now() - t0) / 1000; await draw(); } requestAnimationFrame(loop); };
  scrub.value = +(params.get('t') || 0); draw(); loop();
});
</script>
</body>
</html>
